<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pay · stripe-reconciler</title>
<link rel="stylesheet" href="_style.css">
</head>
<body>
<main>
  <h1>Test payment</h1>
  <p>Sandbox only. Use <code>4242 4242 4242 4242</code> to succeed, <code>4000 0000 0000 0002</code> to decline.</p>
  <p class="amount">$20.00</p>
  <button id="pay" type="button">Pay with Checkout</button>
  <p class="status" id="status" role="status" aria-live="polite"></p>
</main>
<script>
  const button = document.getElementById("pay");
  const status = document.getElementById("status");

  button.addEventListener("click", async () => {
    button.disabled = true;
    status.textContent = "";
    try {
      const response = await fetch("/payments", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mode: "checkout", amount: 2000, currency: "usd" }),
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) {
        status.textContent = (body.detail || response.status) + "";
        button.disabled = false;
        return;
      }
      window.location.href = body.url;
    } catch (error) {
      status.textContent = "Could not reach the service.";
      button.disabled = false;
    }
  });
</script>
</body>
</html>
